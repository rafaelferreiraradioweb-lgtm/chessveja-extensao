<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #161512; color: #bababa; margin: 0; padding: 15px; }
        h2 { color: #fff; font-size: 18px; margin-bottom: 15px; text-align: center; }
        .card { background: #262421; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; margin-bottom: 10px; }
        .btn-analisar { background-color: #629924; color: white; }
        .btn-analisar:hover { background-color: #53811e; }
        .btn-analisar:disabled { background-color: #444; cursor: not-allowed; }
        .btn-vip { background-color: #d5a021; color: #161512; }
        .btn-login { background-color: #4285F4; color: white; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 20px; font-weight: bold; color: #fff; }
        #resultado { display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; font-size: 13px; line-height: 1.5; }
        .limite { font-size: 11px; color: #888; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>♟️ Chessveja IA</h2>

    <div class="card">
        <div id="secao-login">
            <button id="btn-login" class="btn btn-login">🌐 Entrar com Google</button>
            <p id="user-info" style="display:none; text-align:center; margin-bottom:10px; font-weight:bold; color:#629924;"></p>
        </div>

        <div class="limite">
            Plano: <span id="plano-status">Gratuito</span><br>
            Análises restantes hoje: <span id="contador-analises">3/3</span>
        </div>

        <button id="btn-analisar" class="btn btn-analisar">Analisar Partida Atual</button>
        <button id="btn-upgrade" class="btn btn-vip">👑 Ser VIP (Análises Ilimitadas)</button>
        
        <div id="resultado">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="qtd-genial">-</span>
                    🌟 Geniais
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="qtd-capivarda">-</span>
                    🐴 Capivaras
                </div>
            </div>
            <p id="texto-analise" style="margin-top:15px; color: #ddd;"></p>
        </div>
    </div>

    <button id="btn-exportar" class="btn" style="background:#333; color:#fff;">📸 Exportar Resumo</button>

    <script src="popup.js"></script>
</body>
</html>
