<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; padding: 15px; font-family: sans-serif; background-color: #2c2c2c; color: white; }
        button { width: 100%; padding: 10px; background-color: #f1c40f; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; color: #333; }
        button:hover { background-color: #f39c12; }
        select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
        #result { margin-top: 15px; font-size: 14px; line-height: 1.4; }
        .header { text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon.png" width="32" style="vertical-align: middle; margin-right: 8px;">
        <h3 style="display: inline; vertical-align: middle;">Diagnóstico do Chessveja</h3>
    </div>
    <select id="level">
        <option value="iniciante">Iniciante</option>
        <option value="intermediario">Intermediário</option>
        <option value="avancado">Avançado</option>
    </select>
    <button id="btn-analisar">Analisar Agora</button>
    <div id="result"></div>
    
    <script src="popup.js"></script>
</body>
</html>
