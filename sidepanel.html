<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; }
        h2 { color: #2c3e50; font-size: 18px; text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        button { background-color: #2c3e50; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1a252f; }
        .btn-whatsapp { background-color: #25D366; margin-top: 15px; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: #e74c3c; }
        #resultado { margin-top: 20px; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; font-size: 14px; line-height: 1.5; }
        #resultado h3 { color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 5px; font-size: 16px; margin-top: 15px;}
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #2c3e50; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h2>♟️ Diagnóstico VIP - Chessveja</h2>
    <p style="font-size: 13px; text-align: center;">Abra uma partida no Lichess e clique abaixo para analisar.</p>
    
    <button id="btn-analisar">Analisar Partida Atual</button>
    
    <div class="spinner" id="loading-spinner"></div>
    <div id="status"></div>

    <div id="resultado">
        <div id="texto-laudo"></div>
        <button id="btn-wpp" class="btn-whatsapp">📲 Enviar para o Mestre</button>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
